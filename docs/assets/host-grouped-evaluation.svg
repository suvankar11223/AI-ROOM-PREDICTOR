<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Why Staywise uses a host-grouped holdout</title>
  <desc id="desc">A row-random split can put different listings from the same host in both train and test. Staywise groups by host ID so every listing from a host stays on one side of the holdout.</desc>
  <defs>
    <style>
      .kicker{font:600 11px Arial,sans-serif;letter-spacing:1.4px;fill:#9c360a}
      .title{font:600 24px Arial,sans-serif;fill:#15140f}
      .head{font:600 17px Arial,sans-serif;fill:#15140f}
      .body{font:13px Arial,sans-serif;fill:#55514a}
      .small{font:12px Arial,sans-serif;fill:#6f6a5e}
      .card{fill:#fdfcf9;stroke:#c9c2b1;stroke-width:1.5}
      .train{fill:#e9f0ed;stroke:#1c6b4f}
      .test{fill:#f7e9e1;stroke:#c0430d}
      .warn{fill:#f7e9e1;stroke:#c0430d}
      .ok{fill:#e9f0ed;stroke:#1c6b4f}
      .label{font:600 11px Arial,sans-serif;letter-spacing:.8px}
    </style>
  </defs>
  <rect width="1280" height="430" rx="8" fill="#f4f1ea"/>
  <text x="42" y="44" class="kicker">EVALUATION DESIGN</text>
  <text x="42" y="78" class="title">Keep each host on one side of the test boundary</text>

  <rect x="42" y="112" width="574" height="254" rx="6" class="card"/>
  <text x="66" y="147" class="head">Basic row-random split</text>
  <text x="66" y="171" class="small">Listings are split independently; one host can appear in both sets.</text>
  <text x="66" y="211" class="label" fill="#1c6b4f">TRAIN</text>
  <text x="402" y="211" class="label" fill="#c0430d">TEST</text>
  <rect x="66" y="225" width="208" height="38" rx="4" class="train"/>
  <text x="80" y="249" class="body">Host A / listing 1</text>
  <rect x="66" y="272" width="208" height="38" rx="4" class="test"/>
  <text x="80" y="296" class="body">Host A / listing 2</text>
  <rect x="356" y="225" width="222" height="38" rx="4" class="test"/>
  <text x="370" y="249" class="body">Host A / listing 3</text>
  <rect x="356" y="272" width="222" height="38" rx="4" class="train"/>
  <text x="370" y="296" class="body">Host B / listing 1</text>
  <rect x="66" y="322" width="512" height="26" rx="3" class="warn"/>
  <text x="80" y="340" class="label" fill="#9c360a">HOST A LEAKS ACROSS THE BOUNDARY</text>

  <rect x="664" y="112" width="574" height="254" rx="6" class="card"/>
  <text x="688" y="147" class="head">Staywise host-grouped split</text>
  <text x="688" y="171" class="small">GroupShuffleSplit keeps every host's listings together.</text>
  <text x="688" y="211" class="label" fill="#1c6b4f">TRAIN</text>
  <text x="1024" y="211" class="label" fill="#c0430d">TEST</text>
  <rect x="688" y="225" width="208" height="38" rx="4" class="train"/>
  <text x="702" y="249" class="body">Host A / listings 1-3</text>
  <rect x="688" y="272" width="208" height="38" rx="4" class="train"/>
  <text x="702" y="296" class="body">Host C / listings 1-2</text>
  <rect x="978" y="225" width="222" height="38" rx="4" class="test"/>
  <text x="992" y="249" class="body">Host B / listings 1-2</text>
  <rect x="978" y="272" width="222" height="38" rx="4" class="test"/>
  <text x="992" y="296" class="body">Host D / listing 1</text>
  <rect x="688" y="322" width="512" height="26" rx="3" class="ok"/>
  <text x="702" y="340" class="label" fill="#1c6b4f">MEASURE GENERALIZATION TO UNSEEN HOSTS</text>

  <text x="42" y="399" class="small">Actual holdout: 14,596 listings / 11,238 test hosts / 0 train-test host overlap.</text>
</svg>
